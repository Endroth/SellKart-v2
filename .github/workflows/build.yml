
name: Build SellKart

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Mostrar arquivos gerados
        run: |
          echo "Arquivos JAR encontrados:"
          find target -type f -name "*.jar" -print

      - name: Salvar o plugin para download
        uses: actions/upload-artifact@v4
        with:
          name: SellKart-Plugin
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
